name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Build Debug APK
        run: ./gradle-9.3.1/bin/gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfKit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
